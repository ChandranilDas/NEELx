name: Build NEELx (Windows)

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'windows/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/NEELx.Windows.sln

      - name: Build NEELx for Windows 11 (Release)
        run: dotnet build windows/NEELx.Windows.sln --configuration Release --no-restore

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEELx-Windows-11-Release
          path: windows/src/NEELx.App/bin/Release/net8.0-windows/
          retention-days: 14
