name: Build NEELx (Windows)

on:
  push:
    branches: [ main ]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'windows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag from VERSION
        shell: pwsh
        run: |
          $ver = if (Test-Path VERSION) { (Get-Content VERSION).Trim() } else { "2.0.0-beta.6" }
          Write-Host "Resolved VERSION=$ver"
          "RELEASE_TAG=v$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/NEELx.Windows.sln

      - name: Build NEELx for Windows 11 (Release)
        run: dotnet build windows/NEELx.Windows.sln --configuration Release --no-restore

      - name: Validate Windows Installer & Uninstaller PowerShell Scripts
        shell: pwsh
        run: |
          foreach ($scriptPath in @("windows/install.ps1", "windows/uninstall.ps1", "website/install.ps1")) {
            $tokens = $null
            $parseErrors = $null
            $fullPath = (Resolve-Path $scriptPath).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($fullPath, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              throw "PowerShell syntax errors in ${scriptPath}: $($parseErrors -join '; ')"
            }
            Write-Host "Validated $scriptPath cleanly."
          }

      - name: Publish Single All-in-One Windows 11 Standalone Package
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $outDir = "dist-windows"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # Single All-in-One Standalone package (self-contained .NET 8, DirectML, models, Run-NEELx.bat; zero prerequisites)
          dotnet publish windows/src/NEELx.App/NEELx.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o "$outDir/standalone"
          Copy-Item windows/README.md "$outDir/standalone/README.md"
          Copy-Item windows/Run-NEELx.bat "$outDir/standalone/Run-NEELx.bat"
          Compress-Archive -Path "$outDir/standalone/*" -DestinationPath "$outDir/NEELx-$tag-windows-x64.zip" -Force
          Copy-Item "$outDir/NEELx-$tag-windows-x64.zip" "$outDir/NEELx-$tag-windows-x64-portable.zip" -Force

          $winHash = (Get-FileHash "$outDir/NEELx-$tag-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          $winBytes = (Get-Item "$outDir/NEELx-$tag-windows-x64.zip").Length

          @"
          $winHash  NEELx-$tag-windows-x64.zip
          $winHash  NEELx-$tag-windows-x64-portable.zip
          "@ | Set-Content -Path "$outDir/NEELx-$tag-windows-SHA256SUMS.txt" -Encoding UTF8

          Write-Host "WIN_STANDALONE_SHA256=$winHash SIZE=$winBytes"

      - name: Upload Windows package to GitHub Release (on main push)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          # Ensure release exists first so upload never fails if Windows finishes before macOS
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "NEELx $tag" --notes "NEELx $tag — 100% Offline 3D Biometric Face Unlock" --prerelease
          }
          gh release upload $tag `
            "dist-windows/NEELx-$tag-windows-x64.zip" `
            "dist-windows/NEELx-$tag-windows-x64-portable.zip" `
            "dist-windows/NEELx-$tag-windows-SHA256SUMS.txt" `
            --clobber

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEELx-Windows-11-Packages
          path: dist-windows/*.zip
          retention-days: 14
