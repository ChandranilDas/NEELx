name: Build NEELx (macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26+ (Swift 6.2)
        run: |
          if [ -d "/Applications/Xcode_26.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Resolve Release Version
        run: |
          VERSION="$(cat VERSION 2>/dev/null | tr -d '[:space:]' || echo "2.0.0-beta.6")"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV

      - name: Build NEELx.app & Package Universal DMG
        run: |
          chmod +x build.sh package_dmg.sh
          python3 source/tools/fetch_depth_model.py
          ./package_dmg.sh --universal --with-depth
          shasum -a 256 "NEELx-v${VERSION}-universal.dmg" > "NEELx-v${VERSION}-macOS-SHA256SUMS.txt"
          cat "NEELx-v${VERSION}-macOS-SHA256SUMS.txt"

      - name: Upload macOS Universal DMG to GitHub Release (on main push)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it doesn't exist, or upload assets
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "NEELx $TAG" \
            --notes "NEELx $TAG — 100% Offline 3D Biometric Face Unlock with Passkey Companion & Desk Stand Continuity Studio." \
            --prerelease
          
          gh release upload "$TAG" \
            "NEELx-v${VERSION}-universal.dmg" \
            "NEELx-v${VERSION}-macOS-SHA256SUMS.txt" \
            --clobber
