name: Build NEELx (macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build NEELx.app from source
        run: |
          chmod +x build.sh package_dmg.sh
          ./build.sh

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 NEELx.app
