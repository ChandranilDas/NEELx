name: Build NEELx (macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26+ (Swift 6.2)
        run: |
          if [ -d "/Applications/Xcode_26.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Build NEELx.app from source
        run: |
          chmod +x build.sh package_dmg.sh
          ./build.sh

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 NEELx.app
